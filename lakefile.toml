# A paper project on top of LMLExplore. LMLExplore brings Mathlib, Tau Ceti and LML at the versions
# it pins: never require them here, or at other revisions (`scripts/check-pins.sh` checks).
name = "Garivier2016Optimal"
defaultTargets = ["Garivier2016Optimal"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# LMLExplore's settings, which ForLMLExplore/ must meet. The two long-file options must agree, or
# the linter asks for a `set_option` in every short file.
weak.linter.style.header = true
weak.linter.style.longFile = 1500
weak.linter.style.longFileDefValue = 1500

[[require]]
name = "LMLExplore"
git = "https://github.com/LeanMachineLearning/LMLExplore"
rev = "main"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "Garivier2016Optimal"

# Comparator (https://github.com/leanprover/comparator) challenge and solution modules for the
# headline results listed in formalization.yaml; see comparator/README.md. One library with a stub
# root: tools that import every library root (checkdecls) must not load the challenge modules,
# which redeclare project and LMLExplore names, so those are globs, not roots. Add one
# "Challenge_<name>" entry per line of comparator/targets.txt.
[[lean_lib]]
name = "Comparator"
srcDir = "comparator"
leanOptions = { weak.linter.mathlibStandardSet = false, weak.linter.style.header = false }
globs = [
  "Comparator",
  "Solution",
  "Challenge_charTime_mul_klBer_le_expectedStoppingTime",
  "Challenge_eventually_mul_log_le_expectedStoppingTime",
  "Challenge_mem_optAlloc_iff_exists_scalar",
  "Challenge_pos_of_mem_optAlloc",
  "Challenge_continuousAt_of_mem_optAlloc",
  "Challenge_le_of_mem_optAlloc_of_le",
  "Challenge_measureReal_glrt_bernoulli_le",
  "Challenge_exists_measureReal_glrt_expFamilyEvidence_le",
  "Challenge_stoppingTime_glrt_ne_top_and_limsup_le",
  "Challenge_limsup_expectedStoppingTime_trackAndStop_div_log_le",
  "Challenge_limsup_expectedStoppingTime_cTrackAndStop_div_log_le",
]
