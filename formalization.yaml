# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml for the fields.

version: "v0.4"

project:
  name: "Garivier2016Optimal"
  description: >-
    A Lean 4 formalization of "Optimal Best Arm Identification with Fixed Confidence" (Garivier and
    Kaufmann, COLT 2016) on top of LMLExplore, and through it LML, Tau Ceti and Mathlib: the lower
    bound on the sample complexity of δ-correct strategies, the characterization and the properties
    of the optimal allocation, the informational and deviational thresholds of Chernoff's stopping
    rule, and the almost sure and expected sample complexity of Track-and-Stop, for arms in an
    exponential family. Most of the paper is already in LMLExplore, often in more generality; the
    paper's statements here specialize it, and the library-shaped results it lacks are ported to
    LMLExplore. Phase 1 states the headline results with sorry; phase 2 proves them.
  authors:
    - "Remy Degenne"
  responsible_maintainers:
    - "Remy Degenne"
  license: "Apache-2.0"
  repository: "https://github.com/RemyDegenne/Garivier2016Optimal"
  blueprint: "https://RemyDegenne.github.io/Garivier2016Optimal/blueprint/"

repository:
  role: "substantive-development"

sources:
  - title: "Optimal Best Arm Identification with Fixed Confidence"
    authors:
      - "Aurélien Garivier"
      - "Emilie Kaufmann"
    id: "arXiv:1602.04589v2 (COLT 2016)"
    type: "conference-paper"
    location: "Theorems 1, 5, 10 and 14, Remark 2, Propositions 6, 12 and 13; see status.scope"
    relationship: "formalizes"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The arXiv sources of revision v2 are in source/arXiv-1602.04589v2/; the citations
      [GK16, Theorem 1] use its numbering. The blueprint is a derived artifact of this project. The
      formalizer is not an author. Errors found in the paper are in notes/paper-errata.md.

related_formalizations: []

classification:
  arxiv: ["math.ST", "stat.ML", "cs.LG"]
  msc2020:
    - "62L10"   # Sequential statistical analysis
    - "62L05"   # Sequential statistical design
    - "68T05"   # Learning and adaptive systems

status:
  scope: >-
    Phase 1 (statements, 2026-11-08). The headline results are stated in Lean with sorry, in
    Garivier2016Optimal/GK2016/, one file per result, for best arm identification on the vectors of
    means of an exponential family (ρ, id) with a unique best arm: Theorem 1 and Remark 2 (the lower
    bound), Theorem 5 (the optimal allocation from a scalar equation), Proposition 6 (positivity,
    continuity and ordering of the optimal allocation), Theorem 10 (the informational threshold for
    Bernoulli arms), Proposition 12 (the deviational threshold), Proposition 13 (the almost sure
    upper bound) and Theorem 14 (asymptotic optimality of Track-and-Stop in expectation, with
    D-tracking and with C-tracking). The statements were checked against the paper on 2026-11-08,
    which corrected Proposition 12 (erratum E2), and the comparator challenges are set up in
    comparator/. The lemmas of the paper that LMLExplore proves
    (Lemmas 3, 4, 7, 8, 15, 17 and 19, Proposition 9) are cited in the blueprint.
    Phase 2, round of 2026-11-08: Theorem 1, Remark 2, Proposition 6 parts 1 and 2, and Theorem 14
    with D-tracking and with C-tracking are proved, as specializations of LMLExplore; Theorem 14
    needed the continuity of the cost of the alternatives near a model, which LMLExplore has as a
    private lemma (ForLMLExplore/Identification/Task/BestArm.lean, PAPER_ROADMAP.md R14); the
    refactor pull request LeanMachineLearning/LMLExplore#242 makes it public.
    Phase 2, round of 2026-11-08 (the optimal allocation): Proposition 6 part 3 is proved, from the
    ordering of the optimal and β-optimal allocations of best arm identification like the means
    (ForLMLExplore/Identification/Task/BestArmOrder.lean, PAPER_ROADMAP.md R7), proved from
    Lemma 4 and the monotonicity of the pair costs, without the scalar equation. The Lean statement
    of Theorem 5 was false for a single arm; by the decision of 2026-11-08 it assumes an arm
    b ≠ a, which the paper leaves implicit (notes/statement-corrections.md).
    Phase 2, round of 2026-11-08 (the almost sure upper bound): Proposition 13 is proved, from the
    almost sure sample complexity of the GLRT for any task, estimator and thresholds
    log(1/δ) + o(t) (ForLMLExplore/Identification/AlmostSure.lean, PAPER_ROADMAP.md R11) and the
    strong law of large numbers for the empirical means of a run
    (ForLMLExplore/SequentialLearning/SumRewards.lean).
    Phase 2, round of 2026-11-08 (the deviational threshold): Proposition 12 is proved, for every
    exponent p > 0, with the constant C = δ exp(c_{p,K} + 2 x_δ), from the GLRT error bound for any
    task on vectors of means and arms dominated by any exponential families
    (ForLMLExplore/Identification/DeviationalThreshold.lean, PAPER_ROADMAP.md R10). It rests on a
    peeling of the numbers of pulls of each arm over dyadic slices in LML's reward stream model
    (ForLMLExplore/SequentialLearning/RateFunctionDeviation.lean), from the exponential
    supermartingale bound for i.i.d. sums (ForLMLExplore/Probability/Martingale/RateFunction.lean).
    Phase 2, round of 2026-11-08 (the scalar equation): Theorem 5 is proved, with the second arm
    of the decision of 2026-11-08, from the characterization of the optimal allocation of best
    arm identification by equal costs of the pairs and the equation F = 1
    (ForLMLExplore/Identification/Task/BestArmScalar.lean, PAPER_ROADMAP.md R5): by duality, since
    the cost of each pair is a minimum of functions linear in the allocation, and by a
    first-order perturbation at the optimum, with no derivative of the divergence.
    Phase 2, round of 2026-11-08 (the informational threshold): Theorem 10 is proved, for every
    δ > 0 and all thresholds at least log(2t(K - 1)/δ), from the Krichevsky–Trofimov bound
    [GK16, Lemma 11] (ForLMLExplore/InformationTheory/KrichevskyTrofimov.lean), the likelihood
    ratio supermartingales of a bandit run and their mixtures with Ville's inequality
    (ForLMLExplore/SequentialLearning/LikelihoodRatio.lean), the pairwise deviation inequality of
    Bernoulli arms through the Krichevsky–Trofimov mixture
    (ForLMLExplore/SequentialLearning/KTDeviation.lean), and the bound of the GLR statistic of a
    wrong arm by the evidence of its pair with the best arm
    (ForLMLExplore/Identification/KTThreshold.lean, PAPER_ROADMAP.md R9). The proof found a typo
    in the prior density of Appendix C.1 and a gap for arms without observations (errata E3, E4).
    Every headline result is proved.
  sorry_count: 0
  sorry_in_definitions: 0

alignment:
  namespace: "Garivier2016Optimal"
  note: >-
    The full source-to-Lean map is the blueprint: each environment of blueprint/src/chapters/*.tex
    carries a \lean{} tag. Only the headline statements are repeated here. Each has its Literature
    Links relation, read "paper relation Lean": exactMatch, closeMatch, broadMatch (the Lean
    statement is more general), narrowMatch (the paper's is) or hasPart; and its entry in
    notes/paper-errata.md when the paper had to be corrected.
  statements:
    - source: "thm:lower — Theorem 1, lower bound on the sample complexity"
      lean: "Garivier2016Optimal.charTime_mul_klBer_le_expectedStoppingTime"
      module: "Garivier2016Optimal.GK2016.Theorem1"
      status: "proved"
      relation: "narrowMatch"
      erratum: "E1"
      note: "For δ ≤ 1/2; the paper states it for δ ∈ (0, 1), which is false beyond 1/2."
    - source: "rem:lower_asymptotic — Remark 2, asymptotic lower bound"
      lean: "Garivier2016Optimal.eventually_mul_log_le_expectedStoppingTime"
      module: "Garivier2016Optimal.GK2016.Theorem1"
      status: "proved"
      relation: "closeMatch"
      note: "The liminf ≥ T*(μ) as: for every c < T*(μ), 𝔼[τ_δ] ≥ c log(1/δ) for small δ."
    - source: "thm:scalar — Theorem 5, the optimal allocation from a scalar equation"
      lean: "Garivier2016Optimal.mem_optAlloc_iff_exists_scalar"
      module: "Garivier2016Optimal.GK2016.Theorem5"
      status: "proved"
      relation: "closeMatch"
      note: >-
        Equation form: weights x with x_a = 1 and equal pair costs y, instead of x_b = g_b⁻¹(y).
        For at least two arms, which the paper leaves implicit (notes/statement-corrections.md).
    - source: "prop:optalloc — Proposition 6, part 1, positivity"
      lean: "Garivier2016Optimal.pos_of_mem_optAlloc"
      module: "Garivier2016Optimal.GK2016.Proposition6"
      status: "proved"
      relation: "hasPart"
    - source: "prop:optalloc — Proposition 6, part 2, continuity"
      lean: "Garivier2016Optimal.continuousAt_of_mem_optAlloc"
      module: "Garivier2016Optimal.GK2016.Proposition6"
      status: "proved"
      relation: "hasPart"
    - source: "prop:optalloc — Proposition 6, part 3, ordering"
      lean: "Garivier2016Optimal.le_of_mem_optAlloc_of_le"
      module: "Garivier2016Optimal.GK2016.Proposition6"
      status: "proved"
      relation: "hasPart"
    - source: "thm:kt — Theorem 10, informational threshold for Bernoulli arms"
      lean: "Garivier2016Optimal.measureReal_glrt_bernoulli_le"
      module: "Garivier2016Optimal.GK2016.Theorem10"
      status: "proved"
      relation: "exactMatch"
      note: >-
        The proof uses only δ > 0, not δ < 1, and holds for all thresholds at least
        log(2t(K - 1)/δ); the statement's [Nonempty α] is unused.
    - source: "prop:deviational — Proposition 12, deviational threshold"
      lean: "Garivier2016Optimal.exists_measureReal_glrt_expFamilyEvidence_le"
      module: "Garivier2016Optimal.GK2016.Proposition12"
      status: "proved"
      relation: "narrowMatch"
      erratum: "E2"
      note: >-
        With C depending on δ; the paper's C(α, K), independent of δ, does not exist. The proof
        gives C = δ exp(c_{p,K} + 2 x_δ) and uses only p > 0, not p > 1; the hypothesis that id is
        not ρ-almost everywhere constant is unused.
    - source: "prop:as — Proposition 13, almost sure upper bound"
      lean: "Garivier2016Optimal.stoppingTime_glrt_ne_top_and_limsup_le"
      module: "Garivier2016Optimal.GK2016.Proposition13"
      status: "proved"
      relation: "exactMatch"
      note: >-
        The proof gives the stronger limsup ≤ T*(μ), whatever p ≥ 1; the statement's [Nonempty α]
        is unused.
    - source: "thm:expectation — Theorem 14, with D-tracking"
      lean: "Garivier2016Optimal.limsup_expectedStoppingTime_trackAndStop_div_log_le"
      module: "Garivier2016Optimal.GK2016.Theorem14"
      status: "proved"
      relation: "hasPart"
    - source: "thm:expectation — Theorem 14, with C-tracking"
      lean: "Garivier2016Optimal.limsup_expectedStoppingTime_cTrackAndStop_div_log_le"
      module: "Garivier2016Optimal.GK2016.Theorem14"
      status: "proved"
      relation: "hasPart"
